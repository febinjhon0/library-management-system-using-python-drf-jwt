<!DOCTYPE html>
<html>
<head>
<title>Books</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h2>Book List</h2>

<form method="get">

<input
type="text"
name="search"
placeholder="Search Book">

<button>Search</button>

</form>

<table>

<tr>
<th>Title</th>
<th>ISBN</th>
<th>Author</th>
</tr>

{% for book in books %}

<tr>
<td>{{book.title}}</td>
<td>{{book.isbn}}</td>
<td>{{book.author.name}}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
