<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="login-box">

<h2>Library Login</h2>

<form method="post">

{% csrf_token %}

<input
type="text"
name="username"
placeholder="Username">

<input
type="password"
name="password"
placeholder="Password">

<button>Login</button>

</form>

</div>

</body>
</html>
